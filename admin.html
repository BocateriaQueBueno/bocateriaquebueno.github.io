<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Qué Bueno</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --admin-bg: #0a0a0a;
            --card-bg: #151515;
        }

        body {
            background: var(--admin-bg);
            color: #fff;
            padding-top: 80px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--secondary);
            padding-bottom: 20px;
        }

        .admin-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            padding: 10px 0;
            position: relative;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--secondary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
        }

        .admin-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .admin-section.active {
            display: block;
        }

        .admin-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            padding: 8px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-delete { background: #ff4444; color: white; }
        .btn-edit { background: var(--secondary); color: black; margin-right: 10px; }
        .btn-add { background: var(--accent); color: black; padding: 12px 25px; margin-bottom: 30px; }
        .btn-disponible { background: #2a9d8f; color: white; margin-right: 10px; }
        .btn-no-disponible { background: #e63946; color: white; margin-right: 10px; }

        input, select, textarea {
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Adaptación perfecta a móviles para el Admin */
        @media (max-width: 600px) {
            body {
                padding-top: 60px;
            }
            .admin-container {
                padding: 10px;
            }
            .admin-header {
                margin-bottom: 25px;
                padding-bottom: 10px;
            }
            .admin-header h1 {
                font-size: 1.8rem !important;
                text-align: center;
                width: 100%;
            }
            .admin-tabs {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin-bottom: 20px;
            }
            .tab-btn {
                font-size: 0.9rem;
                padding: 8px 10px;
            }
            .admin-card {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 12px;
                text-align: left;
            }
            .admin-card > div {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            /* Botones de acción alineados en móvil */
            .admin-card > div:last-child {
                flex-direction: row;
                gap: 8px;
            }
            .admin-card .action-btn {
                flex: 1;
                text-align: center;
                padding: 8px 5px;
                font-size: 0.8rem;
            }
            .admin-card .btn-edit {
                margin-right: 0;
            }
            .btn-add {
                width: 100%;
                text-align: center;
                padding: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Qué Bueno <span style="color: var(--secondary); font-size: 0.8rem; vertical-align: middle;">ADMIN</span></div>
            <ul>
                <li><a href="index.html">Ir a la Web</a></li>
                <li><button id="logout-btn" class="filter-btn">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1 style="font-family: 'Permanent Marker', cursive; font-size: 2.5rem;">Gestión del Negocio</h1>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" onclick="showSection(event, 'bocadillos')">Bocadillos</button>
            <button class="tab-btn" onclick="showSection(event, 'productos')">Otros Productos</button>
            <button class="tab-btn" onclick="showSection(event, 'clientes')">Clientes</button>
            <button class="tab-btn" onclick="showSection(event, 'pedidos')">Pedidos</button>
        </div>

        <!-- Section Bocadillos -->
        <section id="bocadillos" class="admin-section active">
            <button class="action-btn btn-add" onclick="openAddModal('bocadillo')">+ Añadir Nuevo Bocadillo</button>
            <div id="admin-bocadillos-list">
                <!-- Se carga dinámicamente -->
            </div>
        </section>

        <!-- Section Productos -->
        <section id="productos" class="admin-section">
            <button class="action-btn btn-add" onclick="openAddModal('producto')">+ Añadir Producto/Extra</button>
            <div id="admin-productos-list">
                <!-- Se carga dinámicamente -->
            </div>
        </section>

        <!-- Section Clientes -->
        <section id="clientes" class="admin-section">
            <div id="admin-clientes-list">
                <!-- Se carga dinámicamente -->
            </div>
        </section>

        <!-- Section Pedidos -->
        <section id="pedidos" class="admin-section">
            <h2 style="margin-bottom: 20px; color: var(--secondary);">Gestión de Pedidos</h2>
            <div id="admin-pedidos-list">
                <!-- Se carga dinámicamente -->
            </div>
        </section>
    </div>

    <!-- Generic Add/Edit Modal -->
    <div class="modal" id="admin-modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="modal-title" style="font-family: 'Permanent Marker', cursive; color: var(--secondary);">Gestionar Item</h2>
                <span class="close-modal" onclick="closeAdminModal()">&times;</span>
            </div>
            <form id="admin-form">
                <div id="form-fields"></div>
                <button type="submit" class="cta-button" style="width: 100%; border: none; margin-top: 20px;">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
